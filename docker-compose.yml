services:
  novalm-hybrid:
    build: .
    image: novalm-hybrid:latest
    container_name: novalm-hybrid
    restart: unless-stopped
    ports:
      - "${NOVALM_HOST_PORT:-8080}:8080"
    environment:
      NOVALM_CHECKPOINT: ${NOVALM_CHECKPOINT:-artifacts/checkpoints/best.pt}
      NOVALM_SP_MODEL: ${NOVALM_SP_MODEL:-artifacts/tokenizers/tokenizer.model}
      NOVALM_CHUNKS_JSON: ${NOVALM_CHUNKS_JSON:-data/index/chunks.json}
    volumes:
      - ./artifacts/checkpoints:/app/artifacts/checkpoints:ro
      - ./artifacts/tokenizers:/app/artifacts/tokenizers:ro
      - ./artifacts/db:/app/artifacts/db
      - ./data/index:/app/data/index:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
