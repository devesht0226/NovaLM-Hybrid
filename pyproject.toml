[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novalm-hybrid"
version = "0.1.0"
description = "Mini transformer LM with hybrid retrieval generation."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1.0,<2.8.0",
  "fastapi>=0.109.0,<0.116.0",
  "uvicorn[standard]>=0.27.0,<0.32.0",
  "httpx>=0.26.0,<0.29.0",
  "sentencepiece>=0.1.99,<0.3.0",
  "scikit-learn>=1.3.0,<1.7.0",
  "numpy>=1.24.0,<2.3.0",
  "pyyaml>=6.0.1,<7.0.0",
  "pydantic>=2.5.0,<3.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "pytest>=7.4.0,<9.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: loads the full API (requires checkpoint, tokenizer, chunks on disk)",
]
addopts = "-q"
